[package]
name = "sundry-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
automerge = "0.5"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
futures = "0.3"

[features]
test-support = []
